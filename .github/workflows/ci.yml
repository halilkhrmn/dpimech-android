name: CI

# One run per commit: pushes (any branch) build here, so a PR from this repository needs no
# second run; pull requests run only when they come from a fork. Docs-only pushes skip CI.
on:
  push:
    paths-ignore: ["docs/**", "**/*.md"]
  pull_request:
    paths-ignore: ["docs/**", "**/*.md"]
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch cancels the older run (never on main).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  NDK_VERSION: 29.0.14206865

jobs:
  test:
    name: Core tests + engines on Linux
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Build ciadpi and hev-socks5-tunnel for Linux
        run: ./native/build-host.sh
      - name: Unit and ciadpi integration tests
        run: |
          export CIADPI=$PWD/build/host/ciadpi
          ./gradlew :core:test --console=plain
      - name: End-to-end test (TUN -> hev -> ciadpi, needs root)
        # Stop the runner user's daemon first: with -E the root client would otherwise reuse it
        # and the test would run without root (and be skipped).
        run: |
          ./gradlew --stop
          sudo -E env "PATH=$PATH" "JAVA_HOME=$JAVA_HOME" \
            CIADPI=$PWD/build/host/ciadpi HEV=$PWD/build/host/hev/bin/hev-socks5-tunnel \
            ./gradlew --no-daemon :core:test --tests '*TunnelEndToEndTest' --rerun --console=plain
      - name: Fail if the end-to-end test was skipped
        run: |
          f=core/build/test-results/test/TEST-io.github.halilkhrmn.dpimech.core.TunnelEndToEndTest.xml
          grep -q 'skipped="0"' "$f" && grep -q 'failures="0"' "$f"
      # Reports only when something failed, kept 3 days.
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: core-test-results
          path: core/build/test-results/
          retention-days: 3

  android:
    name: Android build + lint
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Install NDK and platform
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;$NDK_VERSION" "platforms;android-37.0" > /dev/null
      # Robolectric downloads its Android jars from Maven Central at test time; that download
      # failed twice in a row (2026-11-23/24), so keep them between runs.
      - uses: actions/cache@v4
        with:
          path: ~/.m2/repository/org/robolectric
          key: robolectric-${{ hashFiles('gradle/libs.versions.toml') }}
      - name: Build debug APK, lint, screen tests
        run: ./gradlew :app:assembleDebug :app:lintDebug :app:testDebugUnitTest --console=plain
      # The arm64 debug APK only (nearly every phone; the other ABIs made it ~100 MB a run), kept a
      # week for testing on a phone. Renders and the lint report only when something failed.
      - uses: actions/upload-artifact@v4
        with:
          name: dpimech-debug-apk
          path: app/build/outputs/apk/debug/*arm64-v8a*.apk
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: screenshots
          path: app/build/screenshots/
          retention-days: 3
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.html
          retention-days: 3

  fastlane:
    name: Store metadata (fastlane)
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      # Checks lengths, image sizes and ratios the way F-Droid / IzzyOnDroid read them.
      - uses: ashutoshgngwr/validate-fastlane-supply-metadata@v2
        with:
          fastlaneDir: ./fastlane/metadata/android
          usePlayStoreLocales: false
